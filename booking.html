
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>IPL 2026 Ticket Booking</h1>
        <p>Book Your Favourite Match Tickets!</p>
    </header>

    <main class="booking-container">

        <h2>Ticket Booking Form</h2>

        <form action="#" method="get">

            <!-- Name -->
            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="40"
                pattern="[A-Za-z ]{3,40}"
                title="Enter 3 to 40 letters"
                required
            >

            <!-- Email -->
            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="10-digit mobile number"
                pattern="[0-9]{10}"
                minlength="10"
                maxlength="10"
                title="Enter exactly 10 digits"
                required
            >

            <!-- Match Selection -->
            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Select a Match --</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="RCB vs MI">RCB vs MI</option>
                <option value="CSK vs SRH">CSK vs SRH</option>
                <option value="KKR vs RR">KKR vs RR</option>
            </select>

            <!-- Stand Category -->
            <label for="stand">Select Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General Stand</option>
                <option value="Premium">Premium Stand</option>
                <option value="VIP">VIP Stand</option>
                <option value="Corporate">Corporate Box</option>
            </select>

            <!-- Number of Tickets -->
            <label for="tickets">Number of Tickets:</label>
            <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                placeholder="Enter number of tickets"
                required
            >

            <!-- Additional Preference -->
            <label>Additional Preference:</label>

            <div class="preference">
                <input
                    type="radio"
                    id="family"
                    name="preference"
                    value="Family"
                    required
                >
                <label for="family">Family Seating</label>
            </div>

            <div class="preference">
                <input
                    type="radio"
                    id="friends"
                    name="preference"
                    value="Friends"
                >
                <label for="friends">Friends Seating</label>
            </div>

            <div class="preference">
                <input
                    type="radio"
                    id="individual"
                    name="preference"
                    value="Individual"
                >
                <label for="individual">Individual Seating</label>
            </div>

            <!-- Terms -->
            <div class="preference">
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                >
                <label for="terms">
                    I agree to the booking terms and conditions.
                </label>
            </div>

            <!-- Buttons -->
            <div class="form-buttons">
                <button type="submit">Submit Booking</button>
                <button type="reset">Reset Form</button>
            </div>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </main>

    <footer>
        <p>© 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
